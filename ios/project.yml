# xcodegen generate  (in ios/) -> BirdID.xcodeproj
name: BirdID
options:
  bundleIdPrefix: cc.outman
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_OPTIMIZATION_LEVEL: "-O"     # the pixel loops in Pixels.swift are ~50x slower unoptimised
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  BirdID:
    type: application
    platform: iOS
    sources: [BirdID]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.outman.birdid
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 观羽
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  BirdIDTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BirdIDTests]
    dependencies: [{ target: BirdID }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cc.outman.birdid.tests
schemes:
  BirdID:
    build: { targets: { BirdID: all, BirdIDTests: [test] } }
    test: { targets: [BirdIDTests] }
